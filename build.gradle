allprojects {
    group = "com.flyordie.ui11"
}

subprojects {
    apply plugin: "java-library"

    javadoc.options.encoding = "UTF-8"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.compilerArgs << "--enable-preview"
        options.compilerArgs << "--release" << "21"
        options.compilerArgs << "-parameters"
//            options.compilerArgs << "--add-modules"
//            options.compilerArgs << "jdk.incubator.vector"
    }

    // át kéne állni újabb nyelv verzióra, és akkor nem kéne --enable-preview
    afterEvaluate {
        tasks.withType(Test) {
            jvmArgs "--enable-preview"
        }
        tasks.withType(JavaExec).configureEach {
            jvmArgs += "--enable-preview"
        }
        tasks.withType(Javadoc) {
            var javadocOptions = options as CoreJavadocOptions

            javadocOptions.addStringOption("source", "21")
            javadocOptions.addBooleanOption("-enable-preview", true)
        }
    }

    repositories {
        mavenCentral()
    }

    dependencies {
        implementation 'org.slf4j:slf4j-api:2.0.12'

        api "org.jspecify:jspecify:1.0.0"

        testImplementation 'junit:junit:4.12'
        testRuntimeOnly "org.slf4j:slf4j-simple:2.0.12"
    }

    ext {
        teavmVersion = '0.13.0'
    }
}

tasks.register('aggregateJavadoc', Javadoc) {
    group = "Basic"
    description = "Generates the JavaDoc for all the public API"
    def projectsToDocument = rootProject.subprojects
    source(projectsToDocument.collect({
        [it.sourceSets.main.java]
    }));
    projectsToDocument.forEach {
        classpath += it.sourceSets.main.compileClasspath
    }
    setDestinationDir(new File(buildDir, 'javadoc'));

    exclude("module-info.java");

    options.addStringOption("-release", "21")
    options.addBooleanOption("-enable-preview", true)
    options.addFileOption("overview").setValue(layout.projectDirectory.file("docs/overview.html").asFile)

    options.addBooleanOption("-override-methods=summary").setValue(true);

    options.windowTitle("javadoc title")
    options.header("javadoc header")
    options.bottom("javadoc bottom")

    options.locale("en");
    /*
    if (JDK_DOCS_LINK != "") {
        options.linksOffline(JDK_DOCS, JDK_DOCS_LINK);
    } else {
        options.links(JDK_DOCS);
    }
     */


    doLast {
        projectsToDocument.each { p ->
            def destDir = "${layout.buildDirectory}/javadoc/${p.name}"
            copy {
                from("$p.projectDir/src/main/docs") {
                    include "**/*.html"
                }

                into destDir
            }
        }
    }

    dependsOn(projectsToDocument.collect { project -> project.getTasksByName("classes", true) });
}
