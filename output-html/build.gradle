plugins {
    id "java-library"
    id "me.champeau.jmh" version "0.7.1"
}

dependencies  {
    api "com.flyordie.ui11:base"
    /*
    implementation "com.flyordie.ui11:platform-dom" // ez is JS szerializáláshoz
     */
    implementation "com.flyordie.ui11:controls" // mert néhány controlnak natív HTML implementációja van
    implementation "com.flyordie.ui11:css"
    implementation "com.flyordie.ui11:media"
    testImplementation 'org.openjdk.jmh:jmh-core:1.18';
    testImplementation 'org.openjdk.jmh:jmh-generator-annprocess:1.18';
    testImplementation "com.flyordie.ui11:controls-defaultlook"
}

jmh {
    jvmArgs = ["--enable-preview"]
}
jmhRunBytecodeGenerator {
    jvmArgs = ["--enable-preview"]
}
