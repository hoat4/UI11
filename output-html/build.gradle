plugins {
    id "java-library"
    id "me.champeau.jmh" version "0.7.1"
}

dependencies  {
    api project(":base")
    implementation project(":controls") // because some controls have native HTML implementations
    implementation project(":css")
    implementation project(":media")
    testImplementation 'org.openjdk.jmh:jmh-core:1.18';
    testImplementation 'org.openjdk.jmh:jmh-generator-annprocess:1.18';
    testImplementation project(":controls-defaultlook")
}

jmh {
    jvmArgs = ["--enable-preview"]
}
jmhRunBytecodeGenerator {
    jvmArgs = ["--enable-preview"]
}
